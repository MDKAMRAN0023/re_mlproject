
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance AI Chatbot</title>

    <!-- Markdown library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .chat-header {
            background: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-header p {
            margin-bottom: 0;
        }

        #chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background: #e9ecef;
            color: #222;
            margin-right: auto;
        }

        .bot-message p {
            margin: 5px 0;
        }

        .bot-message ul,
        .bot-message ol {
            padding-left: 20px;
        }

        .bot-message code {
            background: #ddd;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        #message-input:focus {
            border-color: #007bff;
        }

        #send-button {
            padding: 12px 20px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #send-button:hover {
            background: #0056b3;
        }

        #send-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .thinking {
            font-style: italic;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h2>Student Performance AI Assistant</h2>
            <p>Ask me anything about the project</p>
        </div>


        <!-- Chat messages -->
        <div id="chat-box">

            <div class="message bot-message">
                Hello! 👋 I am your Student Performance AI Assistant.
                How can I help you?
            </div>

        </div>


        <!-- Input area -->
        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script>

        const messageInput =
            document.getElementById("message-input");

        const sendButton =
            document.getElementById("send-button");

        const chatBox =
            document.getElementById("chat-box");


        // =========================
        // Add message to chat
        // =========================

        function addMessage(message, className) {

            const messageDiv =
                document.createElement("div");

            messageDiv.classList.add(
                "message",
                className
            );


            // Render Markdown for AI response
            if (className === "bot-message") {

                messageDiv.innerHTML =
                    marked.parse(message);

            } else {

                messageDiv.textContent =
                    message;
            }


            chatBox.appendChild(messageDiv);

            chatBox.scrollTop =
                chatBox.scrollHeight;
        }


        // =========================
        // Send message
        // =========================

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            // Don't send empty message
            if (!message) {
                return;
            }


            // Show user's message
            addMessage(
                message,
                "user-message"
            );


            // Clear input
            messageInput.value = "";


            // Disable button while AI responds
            sendButton.disabled = true;


            // =========================
            // Loading message
            // =========================

            const loadingMessage =
                document.createElement("div");

            loadingMessage.classList.add(
                "message",
                "bot-message",
                "thinking"
            );

            loadingMessage.id =
                "loading-message";

            loadingMessage.textContent =
                "AI is thinking...";

            chatBox.appendChild(
                loadingMessage
            );

            chatBox.scrollTop =
                chatBox.scrollHeight;


            try {

                // =========================
                // Send request to Flask
                // =========================

                const response =
                    await fetch("/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                // Remove loading message
                const loading =
                    document.getElementById(
                        "loading-message"
                    );

                if (loading) {
                    loading.remove();
                }


                // Convert response to JSON
                const data =
                    await response.json();


                // =========================
                // Display AI response
                // =========================

                if (data.response) {

                    addMessage(
                        data.response,
                        "bot-message"
                    );

                } else {

                    addMessage(
                        "Sorry, something went wrong.",
                        "bot-message"
                    );

                }

            } catch (error) {

                console.error(error);


                // Remove loading message
                const loading =
                    document.getElementById(
                        "loading-message"
                    );

                if (loading) {
                    loading.remove();
                }


                addMessage(
                    "Unable to connect to the server.",
                    "bot-message"
                );

            }


            // Enable button again
            sendButton.disabled = false;


            // Put cursor back in input
            messageInput.focus();
        }


        // =========================
        // Send button
        // =========================

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // =========================
        // Press Enter to send
        // =========================

        messageInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {

                    sendMessage();

                }

            }
        );


        // Focus input when page loads
        messageInput.focus();

    </script>

</body>

</html>
